- name: check variables are defined
  assert:
    that:
      - cluster_name is defined
      - version is defined

- name: Check if kubeadm is present at /usr/local/bin/kubeadm
  stat:
    path: /usr/local/bin/kubeadm
  register: kubeadm_stat

- name: Install kubeadm if not present
  block:
    - name: get architecture
      command: dpkg --print-architecture
      register: architecture

    - name: Download kubeadm tar.gz
      get_url:
        url: "{{ archive_root_url }}/kubeadm-{{ version }}-{{ architecture.stdout }}.tar.gz"
        dest: /tmp/kubeadm.tar.gz

    - name: Extract kubeadm archive
      unarchive:
        src: /tmp/kubeadm.tar.gz
        dest: /tmp
        remote_src: true

    - name: Run install-dependencies.sh
      command: bash install-dependencies.sh
      args:
        chdir: /tmp

    - name: Clean up kubeadm archive
      file:
        path: /tmp/kubeadm.tar.gz
        state: absent

  when: not kubeadm_stat.stat.exists